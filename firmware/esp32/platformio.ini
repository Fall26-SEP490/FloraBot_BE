[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_upload.maximum_size = 3145728
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32dev-compilecheck]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DFLORA_COMPILE_CHECK
