<title>FloraBot ERD v3.1 (MVP)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: thanh trên (tiêu đề, chú giải, công cụ) · bản vẽ kéo/zoom ở giữa · ngăn chi tiết bên phải (dưới đáy trên điện thoại) */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --ink:#18201b; --muted:#5d6a62; --line:#d5dcd6; --grid:#e6ebe6;
  --accent:#1f6f50; --hl:#e0a100;
  --c-identity:#3b6fb6; --c-catalog:#b5563b; --c-ordering:#7a4bb0; --c-kiosk_ops:#1f8a63; --c-payment:#b0821a; --c-notify:#5b6b78; --c-ai:#c2457a;
  --zone-a:.07; --card:#ffffff; --row:#f7f9f7;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a201d; --ink:#e6ece8; --muted:#97a69d; --line:#2e3833; --grid:#1d2421;
  --accent:#5fc39a; --hl:#ffcc4d; --card:#1c2320; --row:#212a26; --zone-a:.12;
  --c-identity:#7ea7e6; --c-catalog:#e48a6e; --c-ordering:#b28be0; --c-kiosk_ops:#5fc39a; --c-payment:#e2b552; --c-notify:#9fb0bd; --c-ai:#ec82ad; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a201d; --ink:#e6ece8; --muted:#97a69d; --line:#2e3833; --grid:#1d2421;
  --accent:#5fc39a; --hl:#ffcc4d; --card:#1c2320; --row:#212a26; --zone-a:.12;
  --c-identity:#7ea7e6; --c-catalog:#e48a6e; --c-ordering:#b28be0; --c-kiosk_ops:#5fc39a; --c-payment:#e2b552; --c-notify:#9fb0bd; --c-ai:#ec82ad; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;margin:0;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
h1 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);align-items:center}
.sv{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:1px solid transparent;border-radius:999px;padding:2px 8px 2px 6px;background:none;color:inherit;font:inherit}
.sv:hover,.sv[aria-pressed="true"]{border-color:var(--line);background:var(--row)}
.sv i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ln{display:inline-flex;align-items:center;gap:5px}
.ln svg{width:26px;height:8px}
.tools{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.tools input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:180px}
button.t{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
button.t:hover{border-color:var(--accent)}
button.t[aria-pressed="true"]{background:var(--accent);color:var(--panel);border-color:var(--accent)}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;cursor:grab;background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px;touch-action:none}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.zone{position:absolute;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--zc) 45%,transparent);background:color-mix(in srgb,var(--zc) calc(var(--zone-a)*100%),transparent)}
.zone b{position:absolute;left:14px;top:9px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--zc);font-weight:700}
.zone span{position:absolute;right:14px;top:10px;font-size:11.5px;color:var(--muted)}
.card{position:absolute;width:236px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden;cursor:pointer;transition:opacity .15s,box-shadow .15s}
.card .hd{height:40px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:4px solid var(--zc);border-bottom:1px solid var(--line)}
.card .hd strong{font-family:var(--f-mono);font-size:12.5px;font-weight:600}
.card .hd em{font-style:normal;font-size:11px;color:var(--muted)}
.card .hd .new{font-size:10px;font-weight:700;color:var(--panel);background:var(--zc);border-radius:4px;padding:1px 5px;letter-spacing:.04em}
.r{height:20px;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:4px;padding:0 8px;font-family:var(--f-mono);font-size:11px;border-bottom:1px solid var(--grid)}
.r:nth-child(even){background:var(--row)}
.r .k{font-size:9.5px;font-weight:700;color:var(--muted)}
.r .k.pk{color:var(--hl)} .r .k.fk{color:var(--zc)} .r .k.ref{color:var(--muted)}
.r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .n.req::after{content:" •";color:var(--muted)}
.r .ty{color:var(--muted);font-size:10px}
.card.dim{opacity:.18}
.card.sel{box-shadow:0 0 0 3px var(--hl);opacity:1}
.card.nb{box-shadow:0 0 0 2px color-mix(in srgb,var(--hl) 60%,transparent)}
.card.hit{box-shadow:0 0 0 3px var(--accent)}
.r.hitc{background:color-mix(in srgb,var(--hl) 30%,transparent)}
path.e{fill:none;stroke-width:1.3;opacity:.45;transition:opacity .15s}
path.e.ref{stroke-dasharray:5 4;opacity:.28}
path.e.dim{opacity:.04}
path.e.on{opacity:1;stroke-width:2.2}
#drawer{width:400px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px;box-sizing:border-box}
#drawer h2{font-family:var(--f-mono);font-size:16px;margin:0 0 4px}
#drawer .svc{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#drawer p{line-height:1.55;margin:8px 0;max-width:65ch}
#drawer .chg{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--row)}
#drawer .chg b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
#drawer table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
#drawer td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top;line-height:1.45}
#drawer td:first-child{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap;padding-right:8px}
#drawer td .ty{display:block;color:var(--muted);font-size:10.5px}
#drawer .rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#drawer .rel button{font:inherit;font-size:12px;font-family:var(--f-mono);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:3px 7px;cursor:pointer}
#drawer .intro li{margin:6px 0;line-height:1.5}
.kbadge{font-size:9.5px;font-weight:700;border-radius:3px;padding:0 4px;margin-left:4px;border:1px solid var(--line);color:var(--muted)}
#tip{position:fixed;pointer-events:none;max-width:320px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:7px 9px;border-radius:7px;z-index:9;display:none}
@media (max-width:820px){
  main{flex-direction:column}
  #drawer{width:100%;height:42%;border-left:0;border-top:1px solid var(--line)}
  .tools input{width:130px}
}
@media (prefers-reduced-motion:reduce){.card,path.e{transition:none}}
</style>

function layout(){

    const a=POS[r.from], b=POS[r.to];
    let y1=rowY(r.from,r.col), y2=rowY(r.to,'id');
    if(keysOnly===false && !visCols(T[r.from]).some(c=>c.n===r.col)) y1=a.y+HD/2;
    let x1,x2;
    if(r.from===r.to){ x1=a.x+CW; x2=a.x+CW; }
    else if(a.x+CW < b.x){ x1=a.x+CW; x2=b.x; }
    else if(b.x+CW < a.x){ x1=a.x; x2=b.x+CW; }
    else { x1=a.x+CW; x2=b.x+CW; }
    const dx=Math.max(40,Math.abs(x2-x1)*.45);
    const c1=x1+(x1===a.x?-dx:dx), c2=x2+(x2===b.x?-dx:dx);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',r.from===r.to?`M${x1},${y1} C${x1+60},${y1} ${x2+60},${y2} ${x2},${y2}`:`M${x1},${y1} C${c1},${y1} ${c2},${y2} ${x2},${y2}`);
    p.setAttribute('class','e'+(r.kind==='ref'?' ref':''));
    p.setAttribute('stroke',getComputedStyle(document.documentElement).getPropertyValue('--c-'+T[r.from].service));
    p.dataset.f=r.from; p.dataset.t=r.to; svg.appendChild(p);
  }
}
function neighbors(n){ const s=new Set(); DATA.rels.forEach(r=>{if(r.from===n)s.add(r.to); if(r.to===n)s.add(r.from)}); s.delete(n); return s; }
function applySel(){
  const nb=sel?neighbors(sel):null;
  world.querySelectorAll('.card').forEach(c=>{ const n=c.dataset.t; c.classList.toggle('sel',n===sel); c.classList.toggle('nb',!!nb&&nb.has(n)); c.classList.toggle('dim',!!sel&&n!==sel&&!nb.has(n)); });
  svg.querySelectorAll('path').forEach(p=>{ const on=sel&&(p.dataset.f===sel||p.dataset.t===sel); p.classList.toggle('on',!!on); p.classList.toggle('dim',!!sel&&!on); });
}
function select(n){ sel=(sel===n?null:n); applySel(); renderDrawer(); }
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function renderDrawer(){
  const d=document.getElementById('drawer');
  if(!sel){ d.innerHTML=INTRO; bindIntro(); return; }
  const t=T[sel]; const outs=DATA.rels.filter(r=>r.from===sel), ins=DATA.rels.filter(r=>r.to===sel&&r.from!==sel);
  const relBtn=(arr,dir)=>arr.map(r=>`<button data-go="${dir==='out'?r.to:r.from}" title="${dir==='out'?r.col:r.from+'.'+r.col}">${dir==='out'?r.col+' → '+r.to:r.from+'.'+r.col}${r.kind==='ref'?' ⋯':''}</button>`).join('');
  d.innerHTML=`<div class="svc" style="color:${col(t.service)}">${SVC_LABEL[t.service]}</div>
  <h2>${t.name}</h2><p>${esc(t.purpose)}</p>${t.example?`<p style="color:var(--muted)"><i>Ví dụ:</i> ${esc(t.example)}</p>`:''}
  <div class="chg"><b>${t.old?'Từ bảng sinh viên: '+esc(t.old):'Bảng mới'}</b>${esc(t.why)}</div>
  ${outs.length?`<p style="margin-top:12px"><b>Trỏ tới</b></p><div class="rel">${relBtn(outs,'out')}</div>`:''}
  ${ins.length?`<p style="margin-top:12px"><b>Được trỏ tới từ</b></p><div class="rel">${relBtn(ins,'in')}</div>`:''}
  <table>${t.columns.map(c=>`<tr><td>${c.n}${c.k.map(k=>`<span class="kbadge">${k}</span>`).join('')}<span class="ty">${c.t}${c.null?'':' · bắt buộc'}</span></td><td>${esc(c.d)}</td></tr>`).join('')}</table>`;
  d.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{select(b.dataset.go); centerOn(b.dataset.go)});
  d.scrollTop=0;
}
const INTRO=`<h2 style="font-family:var(--f-ui)">Cách xem</h2>
<ul class="intro" style="padding-left:18px">
<li><b>Bấm một bảng</b> để làm nổi các quan hệ của nó và đọc giải thích từng cột ở ngăn này.</li>
<li><b>Rê chuột lên một cột</b> để xem ý nghĩa nhanh.</li>
<li>Kéo để di chuyển, cuộn hoặc dùng nút −/+ để phóng to.</li>
<li><b>PK</b> khóa chính · <b>FK</b> khóa ngoại trong cùng service · <b>REF</b> mã tham chiếu sang service khác (không FK vì mỗi service có CSDL riêng) · <b>UK</b> không trùng.</li>
<li>Cột <b>•</b>: bắt buộc (NOT NULL).</li>
</ul>
<div class="chg" style="margin-top:14px"><b>v3.1 (MVP) so với v2.1</b>22 bảng / 252 cột (v2.1: 28 / 406). Bỏ preorder, feedback, hoa hồng, voucher, ca làm nhân viên, phiếu công việc, thông báo lưu DB, luật Apriori, order_events, incident_tickets riêng. Thêm tích điểm khách (users.loyalty_points, orders.points_*), nạp hàng theo batch_id, disputes.kind gộp sự cố, sellers.brand_tone cho AI. v3.1 (07/10): gói thuê bao theo BRD §7.1 (subscriptions, sellers PAST_DUE, admin gán ô qua slot_assignments, bỏ slot_rentals); hoàn tiền tay với STK khách tự khai trên e-receipt (orders.refund_bank_*) + đối soát hằng ngày. Giữ nguyên: sổ cái kép, token mở hộc một lần, cách ly tenant, log AI để train.</div>
<p style="margin-top:14px"><b>Đi tới bảng</b></p><div class="rel">${DATA.tables.map(t=>`<button data-go="${t.name}">${t.name}</button>`).join('')}</div>`;
function bindIntro(){ document.querySelectorAll('#drawer [data-go]').forEach(b=>b.onclick=()=>{select(b.dataset.go); centerOn(b.dataset.go)}); }
// zoom & pan
function setT(){ world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
function fit(){ const W=parseFloat(world.style.width), H=parseFloat(world.style.height); const r=stage.getBoundingClientRect(); scale=Math.min((r.width-30)/W,(r.height-30)/H,1); tx=(r.width-W*scale)/2; ty=15; setT(); }
function zoomAt(f,cx,cy){ const ns=Math.min(2.2,Math.max(.15,scale*f)); tx=cx-(cx-tx)*ns/scale; ty=cy-(cy-ty)*ns/scale; scale=ns; setT(); }
function centerOn(n){ const p=POS[n], r=stage.getBoundingClientRect(); if(scale<.6) scale=.75; tx=r.width/2-(p.x+CW/2)*scale; ty=r.height/3-p.y*scale; setT(); }
stage.addEventListener('wheel',e=>{e.preventDefault(); const r=stage.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null;
stage.addEventListener('pointerdown',e=>{ if(e.target.closest('.card')) return; drag={x:e.clientX,y:e.clientY,tx,ty,moved:false}; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; tx=drag.tx+dx; ty=drag.ty+dy; setT(); });
stage.addEventListener('pointerup',e=>{ if(drag&&!drag.moved&&sel){ sel=null; applySel(); renderDrawer(); } drag=null; stage.classList.remove('drag'); });
document.getElementById('zin').onclick=()=>{const r=stage.getBoundingClientRect(); zoomAt(1.2,r.width/2,r.height/2)};
document.getElementById('zout').onclick=()=>{const r=stage.getBoundingClientRect(); zoomAt(1/1.2,r.width/2,r.height/2)};
document.getElementById('fit').onclick=fit;
document.getElementById('keys').onclick=e=>{keysOnly=!keysOnly; e.currentTarget.setAttribute('aria-pressed',keysOnly); layout();};
// legend: bấm service để làm nổi
const lg=document.getElementById('legend');
DATA.services.forEach(([s,l])=>{const b=document.createElement('button'); b.className='sv'; b.setAttribute('aria-pressed','false'); b.innerHTML=`<i style="background:${col(s)}"></i>${l}`;
  b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true'; lg.querySelectorAll('.sv').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed',on);
    world.querySelectorAll('.card').forEach(c=>c.classList.toggle('dim',on&&T[c.dataset.t].service!==s)); sel=null; svg.querySelectorAll('path').forEach(p=>{p.classList.remove('on');p.classList.toggle('dim',on&&T[p.dataset.f].service!==s&&T[p.dataset.t].service!==s)}); renderDrawer();};
  lg.appendChild(b);});
// tìm kiếm
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase(); world.querySelectorAll('.card').forEach(c=>{c.classList.remove('hit'); c.querySelectorAll('.r').forEach(r=>r.classList.remove('hitc'));});
  if(!q) return; let first=null;
  world.querySelectorAll('.card').forEach(c=>{ const t=T[c.dataset.t]; let h=t.name.includes(q); c.querySelectorAll('.r').forEach(r=>{ if(r.dataset.c.includes(q)){ r.classList.add('hitc'); h=true; } }); if(h){ c.classList.add('hit'); first=first||t.name; } });
  if(first&&q.length>2) centerOn(first);
});
const tip=document.getElementById('tip');
function showTip(e,h){ tip.innerHTML=h; tip.style.display='block'; const x=Math.min(e.clientX+14,innerWidth-330); tip.style.left=x+'px'; tip.style.top=(e.clientY+14)+'px'; }
function hideTip(){ tip.style.display='none'; }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawEdges);
new MutationObserver(()=>{drawEdges();applySel()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
layout(); renderDrawer(); requestAnimationFrame(fit); addEventListener('resize',()=>{});
</script>
